# Nombre del proyecto
name: 'my_new_project'
version: '1.0.0'
config-version: 2

# Perfil de conexión
profile: 'default'

# Rutas del proyecto
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Directorio de archivos compilados
target-path: "target"

# Directorios que dbt puede eliminar
clean-targets:
  - "target"
  - "dbt_packages"

# Configuración de los modelos
models:
  my_new_project:

    # Modelos de ejemplo
    example:
      +materialized: table

    # Capa Silver
    staging:
      +materialized: view
      +schema: silver

    # Modelo intermedio
    intermediate:
      +materialized: view

    # Capa Gold
    marts:
      +materialized: table
      +schema: gold