# Nombre del proyecto
name: 'my_new_project'
version: '1.0.0'
config-version: 2

# Perfil de conexion
profile: 'default'

# Rutas del proyecto
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Directorio de archivos compilados
target-path: "target"

# Directorios que dbt clean puede eliminar
clean-targets:
  - "target"
  - "dbt_packages"

# Configuracion de los modelos
models:
  my_new_project:

    # Modelos de ejemplo
    example:
      +materialized: table

    # Modelos de preparacion de datos
    staging:
      +materialized: view

    # Modelo que combina ventas y productos
    intermediate:
      +materialized: view